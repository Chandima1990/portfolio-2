<VirtualHost *:80>
    SuexecUserGroup "#1003" "#1003"
    ServerAlias www.chandimae.com
    DocumentRoot /home/chandimae/public_html
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
    AddType text/plain .php
    RemoveHandler .php
    <FilesMatch \.php$>
        SetHandler None
        AddType text/plain .php
    </FilesMatch>
</VirtualHost>
<VirtualHost *:443>
    ServerName chandimae.com
    ServerAlias www.chandimae.com
    ServerAlias mail.chandimae.com
    ServerAlias webmail.chandimae.com
    ServerAlias admin.chandimae.com
    DocumentRoot /home/chandimae/public_html
    SSLEngine on
    SSLCertificateFile /etc/ssl/virtualmin/174084166765085/ssl.cert
    SSLCertificateKeyFile /etc/ssl/virtualmin/174084166765085/ssl.key
    ErrorLog /var/log/virtualmin/chandimae.com_error_log
    CustomLog /var/log/virtualmin/chandimae.com_access_log combined
    <Directory /home/chandimae/public_html>
        Options -Indexes +IncludesNOEXEC +SymLinksIfOwnerMatch
        AllowOverride All Options=ExecCGI,Includes,IncludesNOEXEC,Indexes,MultiViews,SymLinksIfOwnerMatch
        Require all granted
        AddType text/plain .php
    </Directory>
    ProxyPass /.well-known !
    RewriteEngine On
    RewriteCond %{HTTP_HOST} =webmail.chandimae.com
    RewriteRule ^/(?!.well-known)(.*)$ https://chandimae.com:20000/ [R]
    RewriteCond %{HTTP_HOST} =admin.chandimae.com
    RewriteRule ^/(?!.well-known)(.*)$ https://chandimae.com:10000/ [R]
    RemoveHandler .php
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/
    SSLCACertificateFile /etc/ssl/virtualmin/174084166765085/ssl.ca
    <FilesMatch \.php$>
        SetHandler None
        AddType text/plain .php
    </FilesMatch>
</VirtualHost>
